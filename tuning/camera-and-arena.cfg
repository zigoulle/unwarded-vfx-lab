; CAMERA AND ARENA: where the camera sits.
;
; A closer, lower camera makes every hit look bigger; a farther, higher one
; shows the swarm better but makes hits look small. Try distance 8 to 16 and
; height 6 to 12.
;
; The world is the volcano zone (the ring arena, the connector cavern and
; the lava islands): its shape, pillars, vents, lava and spawns are on the
; volcano page, tuning/zones/volcano.cfg. Where a run starts is the start
; screen's "Start at", not a value here.
;
; Units: m = metres; deg = degrees. The range in brackets is what the game
; accepts. All values here are guesses.

[camera]

; How far behind the player the camera sits; bigger shows more of the arena. m (0.5 to 100). P-O picked 6 (2026-10-12; was 12).
distance_m = 7.0

; How high above the player the camera sits; higher looks down more steeply. m (0 to 100). P-O picked 4 (2026-10-12; was 10).
height_m = 4.0

; How far the camera turns per pixel the mouse moves sideways; raise it if turning feels sluggish. deg per pixel (0.001 to 10). Guess.
mouse_deg_per_pixel = 0.2

; How much further down the camera looks on a curved ground (the lava ball), where the ground drops away ahead and hides what is coming; 0 is the flat camera. Flat ground ignores it. deg (0 to 60). Guess: 0, try 10 to 20 on the ball.
curved_pitch_deg = 0.0

; Whether the camera slides in toward you when its spot would be inside a cliff or a cave wall, so it never sees into the rock (P-O's walkthrough, 2026-11-05). 1 on, 0 off. Guess: 1.
wall_pull = 1

; How far off the rock the camera keeps when it slides in. m (0 to 5). Guess.
wall_margin_m = 0.5

; How long the camera takes to slide back out to its spot once the wall is gone (it slides in at once). s for the whole way (0 to 5). Guess.
wall_release_s = 0.4

; THE LOOK: how the mage and the enemies are drawn so they read from the
; camera, and the warning drawn on the floor under an enemy's area attack.
; Looks only: hit shapes, reach and the ring at each player's feet work the
; same whatever the values here.

[look]

; How tall the mage is drawn, feet to the crown of his head standing. m (0.5 to 10). Guess.
mage_height_m = 1.9

; How strong the line around the mage is, in his player colour; 0 is none, 1 is the full colour. A share (0 to 1). Guess.
mage_outline = 0.1

; How much his own colours glow, lifting him off the dark floor in any light; 0 is none (his materials as lit), 1 is fully self-lit. A share (0 to 2). Guess.
mage_lift = 0.1

; How strong the dark line around every enemy is (one colour for all types); 0 is none, 1 is fully dark. Their size is on the enemies page (model_size_m). A share (0 to 1). Guess.
enemy_outline = 0.5

; How much the enemies' own colours glow, lifting them off the dark floor; 0 is none, 1 is fully self-lit. A share (0 to 2). Guess.
enemy_lift = 0.1

; How thick the line around the mage and the enemies is on screen; it stays the same near or far. Pixels (0 to 20). Guess.
outline_width_px = 2.0

; How solid the ring at each player's feet is, in the player's colour; 0 is invisible, 1 is solid. A share (0 to 1). Guess.
marker_opacity = 0.35

; How wide the band of that ring is; its outer edge stays 0.5 m from his centre. m (0 to 0.5). Guess.
marker_ring_width_m = 0.06

; THE PLAYER GLOW: one faint glow round the outer edge of anything that is a player's (a full gear set, player effects), marking it as his. At 1 it is still dimmer than the enemies' danger glow (their floor warnings and wind-up tints); 0 is none. Drawn without the graphics glow, so it shows on Low. A share (0 to 1). Guess.
player_glow_strength = 0.5

; How long the mage takes to turn to face where he is going; 0 snaps at once, more turns him more slowly (most of a turn in about three times this). Looks only: his attacks, hit shapes and rings always face the new way at once. Seconds (0 to 1). Guess.
turn_smoothing_s = 0.06

; THE TORNADO (heavy, heavy's third beat): swirling sand bands whose outer
; edge is drawn at the tornado's radius (mage.cfg [mage.move.tornado]
; radius_m), its push wall, never taller than this so it never hides the
; fight; the floor shows through it. m (0 to 10). P-O's about 2.5.
tornado_height_m = 2.5

; THE ULTIMATE's HOURGLASS: a see-through sand-gold hourglass round the mage
; while he casts, sand pouring as the cast charges; as the slow begins the
; pour finishes and it shatters, then a faint one stays over him for the rest
; of his slow ("I'm in ult").

; How tall the hourglass is, as a share of his height (1.6 is 1.6 times as tall as he is). A share (0.5 to 4). P-O's 1.6.
hourglass_size = 1.6

; How long the pour takes to finish and the glass to shatter once the slow begins. Seconds (0 to 3). P-O's 0.5.
hourglass_shatter_s = 0.5

; How solid the hourglass left over YOUR mage is for the rest of the slow; 0 is none, 1 is as solid as the cast. A share (0 to 1). P-O's 0.2.
hourglass_marker_own = 0.2

; The same over the OTHER players' mages; raise it if it vanishes over bright lava. A share (0 to 1). P-O's 0.1.
hourglass_marker_other = 0.1

; ENEMY WARNINGS ON THE FLOOR (the golem's slam, the fire elemental's
; circle): a round border at exactly where the hit reaches, and a pale fill
; growing from the centre out; the fill reaches the border the moment the
; damage lands. How big and how long come from the enemies page (slam_range_m
; and slam_windup_frames, circle_radius_m and circle_delay_frames).

; How wide the border of the warning is. m (0 to 1). Guess.
telegraph_border_width_m = 0.08

; How solid that border is; 0 is invisible, 1 is solid. A share (0 to 1). Guess.
telegraph_border_opacity = 0.9

; How solid the growing fill is; keep it well under the border's so the border reads as the edge. A share (0 to 1). Guess.
telegraph_fill_opacity = 0.25

; The warning's colour, as a colour code in quotes: "#" then red, green, blue, two hex digits each (00 to ff). Lava orange-red. Guess.
telegraph_color = "#ff4a1c"

; STUNNED: stars circling a stunned enemy's head, the same whatever stunned it
; (the ground shake today, anything later). How long comes from the enemies
; page (stun_frames).

; The stars' colour, as a colour code in quotes ("#" then red, green, blue, two hex digits each). A neutral pale white-grey, not sand-gold. Guess.
stun_star_color = "#e6e8ee"

; How big each star is drawn. m (0 to 1). Guess.
stun_star_size_m = 0.36

; THE PORTAL ICON on the lava ball: while you stand on the ball, its
; portal down is always marked; a ring over the portal while you can see
; it, else an arrow at the screen's edge pointing the way you'd walk to it.
; The arrow keeps clear of the teammate arrows (and their distances) on the same edge.

; The colour of the icon's ring and its tip, as a colour code in quotes ("#" then red, green, blue, two hex digits each). The portal's molten orange; the glowing doorway inside stays the portal's own. Guess.
portal_icon_color = "#ff731a"

; How big the icon is drawn; 16 is the teammate arrows' size. Pixels (4 to 64). Guess.
portal_icon_size_px = 16.0

; How far in from the screen's edge the edge arrows sit: the portal's and the teammates', on one edge so they keep clear of each other. Pixels (0 to 200). Guess.
edge_arrow_inset_px = 40.0

; How high over the portal's middle the point the ring marks sits, about the top of its standing ring. m (0 to 10). Guess.
portal_icon_raise_m = 2.0

; How big the teammates' edge arrows are drawn. Pixels (4 to 64). Guess.
teammate_arrow_size_px = 16.0

; How long the portal's arrow takes to glide into the ring over the portal as it comes into view, or back. s (0 to 2; 0 swaps at once). Guess.
portal_icon_glide_s = 0.25

; The room the portal's arrow keeps from a teammate's arrow (and its distance) on the same edge. Pixels (0 to 100). Guess.
edge_arrow_gap_px = 8.0

; So the icon doesn't flicker at the screen's edge: the arrow becomes the ring only once the portal is this much further in than the edge arrows. Pixels (0 to 100). Guess.
portal_icon_hold_px = 12.0

; So the icon doesn't flicker at the ball's horizon: the ring stays while a point this much higher over the portal is still in sight. m (0 to 10). Guess.
portal_icon_hold_m = 0.5

; SHOTS: every shot in flight, the players' and the enemies' (the casters' fire, the bees' stings, the throwing knives, the chakram, the Duelist's thrown blades), is drawn this high over the ground, out along the ground's own up wherever it flies (on the climb and the lava ball too); lobs arc along that up and land on the ground. Looks only: where a shot hits is the game's. m (0 to 5). P-O's 1.0 (2026-10-29).
shot_height_m = 1.0
; THE SHADER WARM-UP at launch: everything the game draws with its own shaders is drawn once, hidden behind the wide camera, before the game starts, so nothing compiles mid-fight. It ends once no new shader has compiled for this many frames in a row. Frames (1 to 120). Guess.
warm_up_quiet_frames = 5

; ...or after this long at the latest, even while shaders are still compiling (the rest then compile in game). s (1 to 120). Guess.
warm_up_cap_s = 15.0

; THE LOADING SCREEN over the warm-up shows only once the wait has lasted this long, so a warm launch doesn't flash it. s (0 to 15). P-O's "about half a second" (2026-11-02).
warm_up_screen_after_s = 0.5

; ...its bar reads half full after this many shaders compiled, then slows toward full: how many are left is not known ahead, so it is a guide, and the screen goes when compiling is done. Shaders (1 to 5000). Guess.
warm_up_bar_half_compilations = 200.0

; IN CO-OP the run waits for the slowest player's warm-up, for at most this long; then it starts anyway, and a player still compiling joins and compiles the rest in game. In co-op this stands in for the warm-up's own cap above, so a slow player isn't cut off early. s (1 to 600). P-O's 1 minute (2026-11-02).
warm_up_coop_cap_s = 60.0
