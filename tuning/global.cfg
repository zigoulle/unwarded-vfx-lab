; GLOBAL: master multipliers, one per broad lever, on top of every value on
; the other pages. Each is a percent: 100 changes nothing, 200 doubles the
; whole category, 50 halves it. Try a broad change here first, then fine-tune
; the single values.
;
; They are applied once when the pages are loaded, so the game, the enemies,
; the danger clock and the boss bag all play the scaled numbers, and in co-op
; the host's multipliers count for everyone. Whole-number values round to the
; nearest whole number (never under the lowest their page accepts); decimal
; values keep two decimals; nothing goes past the highest its page accepts
; (a potion chance stops at 100).
;
; The tuning screen shows any multiplier not at 100 (and the effect
; intensity, last, when it is not at 0) in orange, on its Global tab and in
; its top line, so none is forgotten. When a tuning pass is good,
; ask Code to bake them in: it folds them into the single values, sets them
; back to 100 and proves the game plays the same (tuning/README.md).

[global]

; Every normal enemy's max HP (the bosses have their own below; the worm's adds count as normal enemies). Percent (10 to 1000).
enemy_health_percent = 80

; Every hit a normal enemy deals: its attacks, shots, slams, circles, pulses and the skeleton mage's fire tornadoes. Percent (10 to 1000).
enemy_damage_percent = 105

; How fast every enemy moves about: walking, running, flying, drifting, stalking underground. Never its attack timings, dives or shots. Percent (10 to 1000).
enemy_movement_speed_percent = 100

; Every spawn-grid rate, in every area (the ring, the connector, the islands, the lava ball). Percent (10 to 1000).
enemy_spawn_rate_percent = 100

; The worm's and the giant lava blob's max HP (its halves and quarters too). Percent (10 to 1000).
boss_health_percent = 100

; Every hit a boss deals (the worm, which its adds follow, and every size of the giant blob). Percent (10 to 1000).
boss_damage_percent = 105

; Every hit both characters' moves deal. Percent (10 to 1000).
player_damage_dealt_percent = 100

; The player's max HP. Percent (10 to 1000).
player_health_percent = 120

; Every enemy's potion drop chance (stops at 100 percent). Percent (10 to 1000).
potion_drop_chance_percent = 115

; How much each kill fills the boon meter. Percent (10 to 1000).
boon_meter_gain_percent = 125

; How fast the ultimate charges: the mage's cooldown is shorter, the Duelist's gain per enemy struck is bigger. Percent (10 to 1000).
ultimate_charge_percent = 100

; How fast the danger clock runs: its yellow, red and black minutes come sooner, and what it adds a minute (enemy health, the spawn climb) comes faster. Percent (10 to 1000).
danger_clock_speed_percent = 100

; How strong every effect is drawn: the characters' (the mage's sand trail and sparks, the Duelist's lightning), the hits on enemies, the boons' and the lava's. 0 is today's look; 100 reaches the look stills (docs/characters/*/<move>/look.png): brighter, wider, more particles, longer trails, and the brightest lightning may outshine the danger telegraphs. Looks only: the game plays the same, and the bake-in leaves it as it is. Low graphics still keeps its lights and glow off. Percent (0 to 100).
effect_intensity_percent = 0

; How much longer every enemy attack lasts, bosses too: its wind-up, its active part and its recovery, its cooldowns and fire rates, and the body turn that lines it up. 50 means every attack takes x1.5 as long, 100 x2 (time x (100 + this) / 100, as the percents above scale what they name). Walking, flying and stalking stay as they are, and a shot in flight keeps its speed. The tuning screen shows it in orange when it is not at 0; the bake-in leaves it as it is. Percent (0 to 900).
enemy_attack_slowdown_percent = 30

; "yes": the slowdown above raises every enemy hit by the same factor (50: x1.5), so damage per second stays the same. "no": the same hits, slower, so less damage per second. Changes nothing at a slowdown of 0.
enemy_attack_damage_compensation = "yes"
