; VOLCANO: the ring arena, the volcano zone's first area (docs/zones/volcano.md).
;
; A ring of dark rock round a central lava pit, with deep lava outside it
; and dark cave walls beyond. Two rock bridges cross the outer lava: the
; entrance (behind you at the start), whose two outer lanes run under the
; falling lava and burn, and the exit opposite; both are dead ends for now.
; Rock pillars stand on the ring as cover; lava vents erupt on a cycle
; while an enemy is alive in the ring or its boss fight is on; enemies climb
; out of the lava.
; At the default walking speed (6 m/s, character page) one loop round the
; middle of the ring takes about 14 seconds.
;
; The volcano zone is the main world: a run starts in the area picked on
; the start screen's "Start at" (the ring arena, the connector or the lava
; islands), and that area's boss is the first one met. ("Lava ball" starts
; on the lava ball instead: its own page, zones/lava_ball.cfg.)
; Everything here applies on a save, the shape and the pillars and vents
; too (the scenery is rebuilt); only where the players start waits for the
; next run.
;
; Units: m = metres; s = seconds; deg = degrees; frames = 1/60 s. The range
; in brackets is what the game accepts. All values here are guesses.

[ring]

; How far the ring's outer edge is from the centre; the outer lava starts there. P-O ruled a 40 m ring. m (5 to 200). Ruled (Q12).
outer_radius_m = 20.0

; How far the pit's edge is from the centre; the pit is about a third of the arena's width, so about 13 m across. m (0 to 100). Ruled (Q12).
pit_radius_m = 6.67

; How wide the outer lava is between the ring and the cave wall; the bridges cross it. m (0.5 to 100). Guess.
outer_lava_width_m = 6.0

; How wide the exit bridge is (the entrance is four lavafall lanes wide, below). m (0.5 to 50). Guess.
exit_bridge_width_m = 4.0

[pillar]

; How many rock pillars stand round the middle of the ring, evenly spaced. Whole number (0 to 12). P-O asked for four or five.
count = 5

; How wide each pillar is; wide enough to hide a character. m (0.2 to 20). Ruled (Q8).
width_m = 2.5

; How tall each pillar is drawn; looks only. m (0.5 to 30). Ruled (Q8).
height_m = 4.0

; Where round the ring the first pillar stands, from the entrance toward the right; the rest follow evenly. deg (0 to 360). Guess.
first_angle_deg = 18.0

; How many golem slams overlapping a pillar break it; nothing else damages it, your swings pass through it. Whole number (1 to 100). Ruled (Q4).
hits_to_break = 3

; How long a broken pillar lies as a stump before it rises again. s (0 to 3600). Ruled (Q7).
respawn_s = 60.0

; How long the warning ring shows on the floor before a broken pillar rises; anything on its spot is then pushed to its side. s (0 to 60). Guess.
rise_telegraph_s = 1.0

[vent]

; How many lava vents open in the ring, evenly spaced, alternately near the pit and near the outer edge. Whole number (0 to 24). Guess.
count = 6

; How far an eruption reaches from the vent's middle. m (0.1 to 10). Guess.
radius_m = 1.2

; Where round the ring the first vent opens, from the entrance toward the right. deg (0 to 360). Guess.
first_angle_deg = 45.0

; How far in from the ring's edge each vent opens. m (0 to 50). Guess.
inset_m = 2.5

; How often each vent erupts, while an enemy is alive in the ring arena or its boss fight is on; the vents take turns, so they never all go at once. frames (1 to 36000). Guess (5 s).
cycle_frames = 300

; How long the warning on the floor shows before an eruption; the eruption lands when its fill reaches the border. frames (0 to 36000). Guess (1 s).
telegraph_frames = 60

; HP an eruption takes off anyone on the vent, players and enemies alike. Whole number (0 to 100000). Guess.
damage = 12

; How hard an eruption hits a player: "chip", "flinch" or "stagger". P-O ruled the middle tier (Q16).
hit_tier = "flinch"

[lavafall]

; How wide each of the entrance bridge's four lanes is; the bridge is four lanes wide, the middle two safe, the outer two under the falling lava. m (0.2 to 10). Guess (about one character).
lane_width_m = 1.0

; HP the falling lava takes off anyone in an outer lane, players and enemies, each time it burns. Whole number (0 to 100000). Ruled (Q15).
burn_damage = 8

; How often the falling lava burns anyone in an outer lane. frames (1 to 3600). Ruled (Q15: every 0.5 s).
burn_interval_frames = 30

; How hard the burn hits a player: "chip", "flinch" or "stagger". Ruled (Q15).
hit_tier = "chip"

[lava_spawn]

; How long the lava swells and bubbles where an enemy is about to climb out, before it does. s (0 to 120). Ruled (Q9).
swell_s = 6.0

; Nothing climbs out of the lava this close to a player: the spot is chosen clear of every player when the enemy spawns, and never moves: it comes out exactly where its swell or small volcano showed (playtest 2026-10-25 #11). m (0 to 100). Guess.
no_spawn_radius_m = 4.0

; How far onto the ring an enemy stands when it has climbed out. m (0 to 10). Guess.
edge_inset_m = 1.0

; The share of enemies that climb out of the central pit; the rest climb out of the outer lava. A share (0 to 1). Guess.
pit_share = 0.5

; THE WHOLE ZONE (the only world since waves were retired):
; the ring arena, then out through the lavafall opening into the
; connector cavern, then the lava islands, with no loading between them. A
; run starts on the ring by its other bridge (its tunnel stays blocked). You
; can wade the lava between the islands (see [lava] below); the lava sea
; round them stops you.

[zone]

; Grows or shrinks the whole zone in one move: the ring and pit, the bridges, the connector, the islands and the gaps between them, the lava sea's margin and the spawn distances. Not the characters' size or speed, not the camera, and not the lavafall's lanes, a vent's reach or a pillar's width (those are sized to a character). 1 is the ring arena as built. A multiplier (0.25 to 4). Spec.
scale = 1.0

; LAVA, everywhere in the zone, in three tiers. Shallow lava (between the
; islands, and every lava patch) burns at the base rate and does not slow
; you. Deep lava (the ring's outer ring, up to the cave wall) burns harder
; and slows you, but you always walk back out. The lava sea round the
; islands and the ring's central pit stop you like a wall. Only players
; burn: enemies walk all lava freely. Hits and pushes can carry you into
; lava, never into the pit or the sea.

[lava]

; HP shallow lava takes off a player standing in it, each time it burns (a chip: it never shoves or interrupts). The lavafall's lanes burn the same (P-O). Whole number (0 to 100000). Starting value: the lavafall's 8.
shallow_burn = 8

; How often lava burns whoever stands in it; one beat for everyone. frames (1 to 3600). Starting value: the lavafall's 30 (0.5 s).
burn_interval_frames = 30

; How many times the shallow burn deep lava takes off each beat. A multiplier (0 to 100). P-O: 3.
deep_burn_mult = 3.0

; Your walking speed in deep lava, as a share of your normal speed (also your dodges and swings' steps). A share (0 to 1). P-O: 0.5 (50% slower).
deep_speed_mult = 0.5

; How far a character sinks into deep lava, drawn only: the floor steps down under it. m (0 to 5). Guess.
deep_sink_m = 1.5

; DANGER LOOK: the dire zone, lighting only (no new models or lights). From
; [danger] red_min to black_min the zone blends toward these: dimmer, redder,
; the lava hotter. It scales only what the Graphics preset draws (never turns
; glow on or adds lights).

[danger_look]

; How much of its light the zone keeps at black on the clock: the lava's lights, the cool fill and the ambient dim toward it from red_min. A share (0 to 1). Guess.
dim_at_black = 0.6

; The colour the zone's lights, ambient and haze are multiplied by at black (white changes nothing; from red_min the zone blends toward it). A colour code in quotes. Guess.
tint_at_black = "#ff8a70"

; How much brighter the lava glows at black (its emission, a whiter core where the glow is on). A multiplier (1 to 5). Guess.
lava_glow_at_black = 1.5

; HOW THE RING ARENA IS DRAWN (looks only: nothing here changes the fight).
; Lava is the room's only light and only dangerous things glow: the lava,
; the vents, the lavafall. The floor and the rock stay dark.

[zone_look]

; How bright the central pit's lava glows; it is the brightest thing in the room. A share (0 to 10). Guess.
pit_brightness = 1.7

; How bright the outer lava glows (keep it under the pit). A share (0 to 10). Guess.
outer_lava_brightness = 1.1

; How fast the lava's surface drifts round the room. m/s (0 to 10). Guess.
lava_flow_m_per_s = 0.5

; How strongly the lava lights the rock, the floor and the characters (the lights along both lava edges); 1 is the starting look. A share (0 to 10). Guess.
lava_light_energy = 1.0

; How much the faint cracks in the floor glow near the lava; 0 is dark cracks only. A share (0 to 5). Guess.
floor_crack_glow = 0.2

; How strong the dark line around the pillars, the bridges and the tunnel arches is; 0 is none, 1 is fully dark. A share (0 to 1). Guess.
rock_outline = 0.7

; How solid the falling lava over the entrance's two burning lanes looks; low stays see-through. A share (0 to 1). Guess.
lavafall_opacity = 0.4

; How tall the falling lava is drawn over the burning lanes; the camera looks over it. m (0 to 10). The greybox's 2.2.
lavafall_height_m = 2.2

; How big a vent's eruption is drawn; 1 is about a person tall. A share (0 to 5). Guess.
vent_eruption_size = 1.0

; About how often a lava spurt leaps somewhere on the lava (only drawn when on screen). s (0.1 to 60). Guess.
spurt_every_s = 1.5

; How many embers drift up off the lava at once (high quality only). Whole number (0 to 2000). Guess.
embers = 240

; How much the heat bends the air over the lava edges (high quality only); 0 is none. A share of the screen (0 to 0.05). Guess.
heat_shimmer = 0.006

; How many low rock outcrops and ledges stand up the volcano's slope, kept off the way up, the lava flows, their bridges and the cavern mouths; never taller than a knee. Whole number (0 to 400). Guess.
slope_outcrops = 60

; How much the thin lava cracks down the volcano's slope glow (kept dimmer than the enemies' danger marks; gone before the summit); 0 is none. A share (0 to 2). Guess.
slope_crack_glow = 0.35
