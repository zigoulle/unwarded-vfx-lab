; MAGE: the sand/time battle mage's own kit. His move graph (his light and
; heavy combos, [mage.combo]), every move ([mage.move.<name>]) and his
; ultimate ([mage.ultimate]). Every section here is his and starts with
; "mage.", as the Duelist's start with "duelist." on duelist.cfg; a comment
; below naming [combo], [ultimate] or [move.<name>] means the section of
; that name here ([mage.combo], [mage.ultimate], [mage.move.<name>]). How
; each hit lands on impact (the freeze and the shove) is on feel.cfg.
; Walking, HP, the dodge and its meter, the blink, potions, the drink and
; lives are everyone's: they stay on character.cfg.
;
; Units: m = metres (the player is about 2 m tall); m/s = metres per second;
; deg = degrees (360 is a full circle); frames = simulation ticks, 60 per
; second (30 frames is half a second); frame number = a position inside a
; move, its first frame being 1; whole number = no decimal point (5, not 5.5);
; a name = a word in double quotes, like "light_1" ("" means none).
; The range in brackets is what the game accepts.
;
; Where the numbers come from: every number on this page is a guess, picked
; so the light swings are fast, the whirlwinds slower and the ground-shake
; finisher the heaviest. The frame data is the top thing to tune by feel.
;
; What to try first for weight, most telling first (one change at a time,
; note the old value): hitstop (feel.cfg); startup (a longer wind-up sells a
; big swing); recovery (longer is more commitment; if it feels sluggish rather
; than weighty, shorten recovery before startup); the combo windows (an
; earlier window makes a combo flow faster); swing distance; knockback
; (feel.cfg); the camera (camera-and-arena.cfg).

; ---------------------------------------------------------------------------
; THE MOVE GRAPH. Left mouse is light, right mouse is heavy. Pressed while you
; are free, each starts the move named below. Pressed during a move, it
; follows on into that move's next move for the button (its next_light or
; next_heavy), but only on a frame inside the move's combo window: the move
; ends there and the next one starts at once. Starting graph:
;
;   light, light, light       light_1 -> light_2 -> light_3 (the sand-slash ender)
;   light, light, heavy       light_1 -> light_2 -> ground_shake (the finisher)
;   heavy, heavy, heavy       whirlwind -> whirlwind_2 -> tornado (the sand tornado ender)
;
; A press made a little before the window opens is remembered and fires on
; the window's first frame (see buffer_frames). A press after the window, or
; for a button the move has no next move for, is ignored.
;
; A new combo is a new [move.<name>] section with every key below (and its
; hitstop_frames and knockback_m on feel.cfg), linked in by naming it as some
; move's next_light, next_heavy or next_auto.

[mage.combo]

; The move a light press starts while you are free. A name (a [move.<name>] section below).
start_light = "light_1"

; The move a heavy press starts while you are free. A name (a [move.<name>] section below).
start_heavy = "whirlwind"

; How early a press may come before a combo window opens and still fire when it opens. Frozen hitstop frames do not count. Frames (0 to 600; 0 means only presses inside the window count). Guess.
buffer_frames = 10

; Hold light or heavy down and each swing chains into the next as its combo window opens, all the way to the ender, so a fast attack speed never outruns your clicks; tapping still works. 1 on, 0 off. P-O's walkthrough, 2026-11-05: on.
hold_chains = 1

; How long after a swing ends a light or heavy click still continues the chain instead of starting it over, for when a fast attack speed makes the windows shorter than a click. s (0 to 2; 0 off). Guess: 0.3 (P-O's walkthrough, 2026-11-05).
memory_s = 0.3

; How fast every swing and the blink play: their wind-up, hit and follow-through
; frames (and the cancel and combo windows with them) are divided by this, so
; 0.75 makes them a third longer and 1.0 plays the frames below as written.
; The freeze on impact (feel.cfg), the dodge, the drink and the ultimate's cast
; are not scaled; Dagger speeds the light swings up on top. Tune it live,
; then the chosen tempo gets written into the frame data and this goes back to
; 1.0. A share (0.25 to 4). Playtest ruling 7: 0.75, P-O's live-tuning start.
tempo = 0.75

; How much faster the light swings (light_1, light_2, light_3) play on top of
; the tempo: their frames are divided by tempo x this, so 1.2 makes them about
; 20% quicker and the blink after the third light comes sooner (the blink's
; own length, the heavies, the tornado, the dodge, the drink and the cast keep
; the tempo alone). Dagger speeds them up further on top. 1.0 = as the tempo.
; A share (0.25 to 4). P-O's playtest 2026-10-25 point 10: 1.2 (about 20% faster).
light_tempo = 1.2

; How big every heavy attack and heavy ender hits (the whirlwinds' reach, the
; ground shake's reach, the tornado's radius), in percent of the values below:
; 85 makes each 15% smaller. Light swings, the blink and every step and travel
; keep their size; Greatsword and Point of no return reach farther on top.
; Percent (10 to 300). P-O's light vs heavy pass (2026-10-28): about 15% less.
heavy_area_percent = 85.0

; ---------------------------------------------------------------------------
; THE MOVES. Each move is startup (the wind-up, no hit), then active (it
; hits), then recovery (the follow-through, no hit). For the whole move you
; are committed: WASD does not steer it. Its direction is fixed on its first
; frame: the WASD direction held then, or where the camera looks if no key is
; held. The mouse never aims it.
;
; Every move has the same keys:
;   startup_frames, active_frames, recovery_frames: the three parts, in frames.
;   cancel_window_start_frame / _end_frame: frame numbers in which a dodge
;     ends the move early (for dodge_cost, see THE DODGE METER). Frozen
;     hitstop frames do not count.
;   combo_window_start_frame / _end_frame: frame numbers in which a light or
;     heavy press follows on into next_light or next_heavy. 0 and 0 when the
;     move has no next move.
;   next_light, next_heavy: the move a light or heavy press in the combo
;     window leads to; "" for none.
;   next_auto: a move that follows on its own when this one ends; "" for none.
;   distance_m: how far the move carries you, spread over startup and active.
;   reach_m, arc_deg: the hit shape, an arc (a pie slice) around you reach_m
;     deep and arc_deg wide, centred on the move's direction; 360 hits all
;     around you.
;   targets: how many enemies one move can hit, nearest first; 0 = all inside
;     the shape.
;   hit_tier: how hard the hit is for the enemy: "chip", "flinch" or
;     "stagger". Each enemy decides what each tier does to it.
;   damage: HP an enemy loses per hit.
;   stuns: "yes" if the move stuns the enemies it hits (they stand, attack
;     broken, for as long as each enemy's own stun_frames on enemies.cfg), "no"
;     if not.

; THE LIGHT GROUP. [mage.move.light] holds every value of his three light
