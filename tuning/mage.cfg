; ---------------------------------------------------------------------------
; THE TORNADO: heavy, heavy, heavy's third press (P-O's step-3 rulings; on
; the third heavy since his ruling 2026-10-27, no longer on its own). A heavy
; press in the second spin's combo window (from just after its active
; frames to its last frame; pressed a little early, it waits for the
; window): the mage plants his staff
; and channels a sand tornado around himself, walking at walk_percent of his
; speed (P-O 2026-10-23: 30), for channel_frames; the tornado pulses ticks times, evenly spread (pulse k lands
; on channel frame round(k x channel_frames / ticks)), each pulse dealing
; tick_damage to every enemy within radius_m, with no freeze on impact. Every
; frame of the channel pushes every enemy body inside radius_m out to its
; edge (push_m beyond it), so the tornado shields him; projectiles pass
; through. Then recovery_frames to settle.
;
; No third heavy, no tornado: the second spin plays out normally.
; Q during the channel collapses it at once into its recovery. A paid dodge
; also gets him out. A chip does not break it; a flinch or stagger does.
; Greatsword widens radius_m; Warhammer raises tick_damage. It is a heavy
; ender (boons.cfg scopes). The [combo] tempo scales channel_frames and
; recovery_frames like a swing's frames (the pulses spread with it).
;
; A move with channel_frames is a channel: it has exactly these keys, all on
; this page (no hitstop or knockback on feel.cfg).

[mage.move.tornado]

; How long the tornado channels; 120 is 2 seconds (about 2.7 s at the tempo 0.75 above). Frames (1 to 1800). P-O's 120.
channel_frames = 120
; How many times it hits over the channel, evenly spread; independent of the length (6 s with 12 pulses works too). At most channel_frames. Whole number (1 to 600). P-O's 8.
ticks = 8
; HP every enemy inside loses per pulse, a chip at no freeze. 8 x 8 = 64 over the channel: about one more spin (whirlwind 50, whirlwind_2 60) spread out, the shield being the point. Whole number (0 to 100000). Code's start, to tune with P-O.
tick_damage = 16
; How far around him the tornado reaches and pushes; its drawn edge. m (0.1 to 20). P-O's 3.
radius_m = 3.25
; How far beyond the edge an enemy inside is pushed each frame; 0 = exactly to the edge. m (0 to 20). P-O's 0.
push_m = 0.0
; Settle after the channel ends, or after Q collapses it. Frames (0 to 600). P-O's about 10.
recovery_frames = 10
; How hard each pulse is for the enemy. "chip", "flinch" or "stagger". P-O's chip.
hit_tier = "chip"
; How fast he can walk while channelling, as a share of his run speed; 0 = rooted. Percent (0 to 100). P-O's 30 (2026-10-23).
walk_percent = 20.0

; ---------------------------------------------------------------------------
; THE ULTIMATE (F): the mage's time-slow. F while you are free starts a cast:
; you stand still, arm out, a hourglass over your head, for cast_frames. You
; CAN be hurt during the cast, nothing cancels it (not even a paid dodge),
; and a flinch or stagger breaks it: then the ultimate is NOT spent and you
; can press F again once you are free. F during a move, or while it is
; still charging, does nothing.
;
; When the cast completes, every enemy on the map, their attacks, their
; projectiles and their ground circles run at slow_enemy_speed_percent of
; their speed for slow_duration_s. Players are never slowed. A second
; ultimate while one runs (yours or a teammate's) adds its full time: two at
; once is twice the time, 5 s left plus one more is 15 s. Never a deeper slow.
;
; How the ultimate charges is set here per character (charge): the mage's
; is "time", a cooldown that starts when the cast completes. A later
; character can name another way (a rage meter, say).

[mage.ultimate]

; How the ultimate charges back after use. "time" (a cooldown of cooldown_s).
charge = "time"

; How long after a completed cast the ultimate is ready again. Seconds (0 to 3600). Guess: about one per offer.
cooldown_s = 80.0

; How long the committed cast lasts before the slow starts; 24 is 0.4 seconds. Frames (1 to 600). P-O's 0.4 s.
cast_frames = 24

; How fast enemies, their attacks, projectiles and circles run while slowed, in percent of normal; 50 is half speed. Whole number (1 to 100). P-O's 50%.
slow_enemy_speed_percent = 50

; How long one ultimate's slow lasts, added in full to any slow still running. Seconds (0 to 600). P-O's 10 s.
slow_duration_s = 10.0

