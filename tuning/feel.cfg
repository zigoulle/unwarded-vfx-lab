; How big the potion count on its button is. Font size (8 to 32). Guess.
count_font_size = 13.0

; IMPACT: what shows when your hits land. Your attacks draw nothing on the
; floor; the weight is in the animation and these reactions. Sizes are a look
; choice: they never trace where a move can hit (that is reach_m on the
; character page).

[impact]

; How big the spark is on an enemy you hit with a chip hit (the light slashes); 1 is the effect's own size. A share (0 to 10). Guess.
chip_spark_scale = 0.6

; The same for a flinch hit (the third slash, the whirlwinds). A share (0 to 10). Guess.
flinch_spark_scale = 0.9

; The same for a stagger hit (the ground-shake finisher). A share (0 to 10). Guess.
stagger_spark_scale = 1.3

; How far the dust thrown up at your feet spreads when a whirlwind or the ground-shake starts its hit, hit or miss. m (0 to 20). Guess.
