; FEEL: how a hit lands. The freeze on impact (hitstop) and the shove
; (knockback). These sell weight more than anything else; tune them first.
;
; Hitstop: when a move hits, you and the enemy you hit both freeze. It also
; pushes the end of your move (and its cancel and combo windows) back by the
; same amount. Try the heavies (whirlwinds, ground_shake) at 10 to 18 and the
; lights at 4 to 9, and keep every heavy longer than every light.
; Too long feels sticky, like the game hitched.
;
; Knockback: an enemy still alive after the freeze slides away in the move's
; direction, if your hit was hard enough to break its attack (interrupted_by
; on enemies.cfg). A big, quick shove reads as a hard hit.
;
; Units: frames = simulation ticks, 60 per second (5 frames is a twelfth of a
; second); m = metres. The range in brackets is what the game accepts. All
; values here are guesses picked by eye from gameplay video.

[move.light]

; The mage's Light group (see THE LIGHT GROUP on mage.cfg): every light slash
; plays these unless its own [move.light_<n>] below overrides one.

; How long you and each enemy you hit freeze when a light slash hits. Frames (0 to 120). Playtest ruling 7 (was 4).
hitstop_frames = 6

; How far a hit shoves a surviving enemy; 0 means no shove. m (0 to 20). Guess.
knockback_m = 0.6

[move.light_3]

; Hit 3's overrides: the sand-slash ender.

; How long you and each enemy you hit freeze when the sand-slash ender hits (keep its shove at 0 so enemies stay close). Frames (0 to 120). Playtest ruling 7 (was 6).
hitstop_frames = 9

; How far a hit shoves a surviving enemy; 0 means no shove. m (0 to 20). Guess.
knockback_m = 0.0

[move.ground_shake]

; How long you and each enemy you hit freeze when the finisher; it stuns instead of shoving hits. Frames (0 to 120). Guess.
hitstop_frames = 14

; How far a hit shoves a surviving enemy; 0 means no shove. m (0 to 20). Guess.
knockback_m = 0.0

[move.whirlwind]

; How long you and each enemy you hit freeze when the spin hits. Frames (0 to 120). Playtest ruling 7 (was 8), kept above every light.
hitstop_frames = 10

; How far a hit shoves a surviving enemy; 0 means no shove. m (0 to 20). Guess.
knockback_m = 1.5

[move.whirlwind_2]

; How long you and each enemy you hit freeze when the second spin hits. Frames (0 to 120). Playtest ruling 7 (was 10), kept above every light.
hitstop_frames = 12

; How far a hit shoves a surviving enemy; 0 means no shove. m (0 to 20). Guess.
knockback_m = 2.5

