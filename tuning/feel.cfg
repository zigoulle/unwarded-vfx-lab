green = "#3aa845"

; Its colour at [danger] yellow_min (10 minutes). A colour code in quotes. Guess.
yellow = "#e8c12a"

; Its colour at [danger] red_min (20 minutes). A colour code in quotes. Guess.
red = "#d02c24"

; Its colour from [danger] black_min (30 minutes) on. A colour code in quotes. Guess.
black = "#101010"

[enemy_bar]

; The small health bars over enemies: a bar appears over an enemy the first
; time anyone hits it, stays while it keeps being hit, and fades a while after
; the last hit. Enemies nobody has touched show none; bosses have their own
; bar at the top of the screen instead. Looks only: nothing here changes how
; the game plays.

; How long a bar stays at full after its enemy's last hit. Seconds (0 to 30). P-O's playtest (3 s).
hold_s = 3.0

; How long it then takes to fade out. Seconds (0 to 5). Guess.
tail_s = 0.5

; How wide a bar is. m (0.1 to 5). Guess.
width_m = 1.2

; How tall a bar is. m (0.02 to 1). Guess.
height_m = 0.14

; How far above the top of the enemy the bar floats. m (0 to 5). Guess.
above_m = 0.4

[boss_bar]

; The boss bars on the right edge of the screen: a slim upright bar per
; boss that is awake and fighting, emptying downward, with its name above
; it; two awake bosses sit side by side. A sleeping boss shows none; a split
; giant blob is one bar for all its pieces. Looks only: nothing here changes
; how the game plays. Sizes are in the HUD's layout pixels (1152 x 648), so
; they grow with the screen.

; How far in from the right edge of the screen the boss bar sits; with thickness_px, keep it under 14 so the bar stays outside the rack and teammate arrows on the edge. Pixels (0 to 500). Guess.
right_px = 3.0

; How far down from the top of the screen the boss's name starts (its bar under it). Pixels (0 to 600). Guess.
top_px = 190.0

; How long (tall) a boss bar is; 216 is a third of the screen's height. Pixels (40 to 600). Guess.
length_px = 216.0

; How thick (wide) a boss bar is. Pixels (4 to 60). Guess.
thickness_px = 15.0

; The space between two boss bars side by side (each under its name). Pixels (0 to 60). Guess.
gap_px = 10.0

; How big the boss's name above its bar is. Font size (8 to 48). Guess.
font_size = 14.0

; The square buttons at the bottom of the screen: the ultimate, each boss boon,
; the potion and the combo-extension key. Looks only: nothing here changes how
; the game plays. Sizes are in the HUD's layout pixels (1152 x 648), so they
; grow with the screen.

[action_buttons]

