; FEEL: how a hit lands. The freeze on impact (hitstop) and the shove
; (knockback). These sell weight more than anything else; tune them first.
;
; Hitstop: when a move hits, you and the enemy you hit both freeze. It also
; pushes the end of your move (and its cancel and combo windows) back by the
; same amount. Try the heavies (whirlwinds, ground_shake) at 10 to 18 and the
; lights at 4 to 9, and keep every heavy longer than every light.
; Too long feels sticky, like the game hitched.
;
; Knockback: an enemy still alive after the freeze slides away in the move's
; direction, if your hit was hard enough to break its attack (interrupted_by
; on enemies.cfg). A big, quick shove reads as a hard hit.
;
; Units: frames = simulation ticks, 60 per second (5 frames is a twelfth of a
; second); m = metres. The range in brackets is what the game accepts. All
; values here are guesses picked by eye from gameplay video.

[move.light]

; The mage's Light group (see THE LIGHT GROUP on mage.cfg): every light slash
; plays these unless its own [move.light_<n>] below overrides one.

; How long you and each enemy you hit freeze when a light slash hits. Frames (0 to 120). Playtest ruling 7 (was 4).
hitstop_frames = 6

; How far a hit shoves a surviving enemy; 0 means no shove. m (0 to 20). Guess.
knockback_m = 0.6

[move.light_3]

; Hit 3's overrides: the sand-slash ender.

; How long you and each enemy you hit freeze when the sand-slash ender hits (keep its shove at 0 so enemies stay close). Frames (0 to 120). Playtest ruling 7 (was 6).
hitstop_frames = 9

; How far a hit shoves a surviving enemy; 0 means no shove. m (0 to 20). Guess.
knockback_m = 0.0

[move.ground_shake]

; How long you and each enemy you hit freeze when the finisher; it stuns instead of shoving hits. Frames (0 to 120). Guess.
hitstop_frames = 14

; How far a hit shoves a surviving enemy; 0 means no shove. m (0 to 20). Guess.
knockback_m = 0.0

[move.whirlwind]

; How long you and each enemy you hit freeze when the spin hits. Frames (0 to 120). Playtest ruling 7 (was 8), kept above every light.
hitstop_frames = 10

; How far a hit shoves a surviving enemy; 0 means no shove. m (0 to 20). Guess.
knockback_m = 1.5

[move.whirlwind_2]

; How long you and each enemy you hit freeze when the second spin hits. Frames (0 to 120). Playtest ruling 7 (was 10), kept above every light.
hitstop_frames = 12

; How far a hit shoves a surviving enemy; 0 means no shove. m (0 to 20). Guess.
knockback_m = 2.5

[player]

; How an enemy's hit shoves you. A flinch or stagger pushes you away from the
; enemy that hit you, spread evenly over its first frames, while you are held.
; The stagger's longer slide (and the capsule tipping over) is the knockdown.

; How far a flinch shoves you; 0 means no shove. m (0 to 20). Guess.
flinch_slide_m = 0.3

; Over how many frames the flinch's shove plays; 0 means no shove. Frames (0 to 600). Guess.
flinch_slide_frames = 6

; How far a stagger knocks you back. m (0 to 20). Guess.
stagger_slide_m = 1.5

; Over how many frames the stagger's knockback slide plays; fewer frames is a harder blow. Frames (0 to 600). Guess.
stagger_slide_frames = 15

[shake]

; The camera shake: a small, chunky jolt of your camera on heavy moments:
; your ground shake landing on enemies, you being staggered, and a heavy
; slam landing near you (a boss's: the worm's sweep, the giant blob's and its
; pieces' slams; and the golem's staggering slam). It jumps between random spots and dies away over its length.
; Looks only: nothing here changes how the game plays. Each player can turn
; it off in Settings (Gameplay: screen shake); 0 strength removes it for all.

; How far the camera can jump at the start of a shake; it shrinks to nothing over the length. 0 is no shake. m (0 to 1). P-O: a small shake (2026-10-15); guess.
strength_m = 0.06

; How long a shake lasts. Seconds (0 to 2). Guess.
length_s = 0.2

; How near you a heavy slam must land to shake your camera; farther away it only sounds. m (0 to 100). Code's guess: about what the camera shows around you.
near_m = 15.0

[trail]

; The sand slash trail: a grainy sand-gold ribbon behind the staff head on
; every swing, hit or miss, from just before the hit to the end of the
; follow-through, so the swing's arc reads from the camera though the hit
; itself is only a few frames; sand grains fall from the staff head as it
; goes. It runs from the staff head down the shaft and fades fast; it
; follows the staff and never marks where the swing hits. It holds still
; while a hit freezes the swing. Looks only: nothing here changes how the
; game plays. Low quality (--quality=low) draws it without smoothing.

; How wide the ribbon is behind a light swing, from the staff head down the shaft. m (0 to 5; 0 is none). Guess.
light_width_m = 0.3

; How wide behind a heavy swing (whirlwinds, ground shake); keep it clearly wider than the light one. m (0 to 5). Guess.
heavy_width_m = 0.75

; How long the ribbon takes to fade behind the head on a light swing; shorter is snappier. Seconds (0.01 to 2). Matched to the light look still.
fade_s = 0.22

; The same behind a heavy swing; longer, so a whirlwind leaves its whole sand circle. Seconds (0.01 to 2). Matched to the heavy look still.
heavy_fade_s = 0.4

; How bright the sand glows; 1 is its plain colour, more lifts it off the dark floor. A share (0 to 4). Matched to the look stills.
glow = 1.2

; How many frames before the first frame that can hit the trail starts, so the arc into the hit shows. Frames (0 to 60; 0 starts it on the hit). Guess.
lead_frames = 4

; How solid the newest part of the ribbon is; 1 is fully solid. A share (0 to 1). Guess.
opacity = 0.85

; How many sand grains can hang in the air at once behind the staff (a grain falls from the head every 12 cm it travels; when all are out, the oldest goes first). 0 is none. Whole number (0 to 64). Guess.
grain_count = 32

; How big each sand grain is drawn. m (0 to 0.5). Guess.
grain_size_m = 0.1

; How long a grain falls, fading, before it is gone. Seconds (0.05 to 3). Guess.
grain_life_s = 0.5
