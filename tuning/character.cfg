; CHARACTER: what every character shares, whoever he plays. Walking, HP,
; the dodge and its meter (the paid cancel), the blink, potions, the drink,
; lives and revive. Each character's own kit (his combos, moves and
; ultimate) is on his own page: the mage's on mage.cfg, the Duelist's on
; duelist.cfg.
;
; Units: m = metres (the player is about 2 m tall); m/s = metres per second;
; frames = simulation ticks, 60 per second (30 frames is half a second);
; frame number = a position inside a move, its first frame being 1; whole
; number = no decimal point (5, not 5.5). The range in brackets is what the
; game accepts.

[player]

; Walking speed with WASD; diagonals are as fast as straight lines. m/s (0 to 50). Guess.
move_speed_m_per_s = 6.0

; Hit points a player starts with. Reaching 0 puts you down (see [downed] at the end of this page). Whole number (1 to 100000). Guess.
max_hp = 100

; How far apart the two players start: the host in the middle, the second player this far east. m (0 to 50). Guess.
spawn_spacing_m = 2.0

; How long a medium enemy hit (a flinch) takes control away: it breaks your current move, then you stand helpless this long, unless you pay to dodge out (below). Frames (1 to 600). Guess.
flinch_frames = 15

; How long a heavy enemy hit (a stagger) knocks you down and takes control away; nothing gets you out early, not even paying. Frames (1 to 600). Guess.
stagger_frames = 60

; THE DODGE METER. Every dodge is paid from a meter (the thin bar under your
; HP), at one of two prices (P-O's ruling). An ordinary dodge, from neutral
; or with Space inside a move's cancel window, costs dodge_cost. A paid
; cancel, Space at any other time (mid-move outside the cancel window, during
; hitstop, or while flinched), costs the higher paid_cancel_cost and dodges
; you out at once. A paid cancel never works on a stagger, during a dodge or
; blink, during the ultimate's cast or while drinking. A dodge the meter
; holds too little for does not happen and costs nothing. The meter starts
; full, refills slowly on its own, and faster when you land hits, so
; attacking funds your dodges.

; How much the meter holds when full. Points (1 to 100000). Guess.
cancel_resource_max = 100.0

; What one ordinary dodge costs (from neutral, or inside a move's cancel window); 15 with a full meter of 100 is six dodges in a row. Points (0 to 100000). Guess: low, so you dodge often but not forever.
dodge_cost = 30.0

; What one paid cancel costs; 50 with a full meter of 100 is two escapes in a row. Points (0 to 100000). Guess.
paid_cancel_cost = 50.0

; How fast the meter refills on its own; 5 is ten seconds for one paid cancel, three for an ordinary dodge. Points per second (0 to 100000). Guess: slow on purpose.
cancel_resource_refill_per_s = 4.0

; How much the meter gains for each enemy your swings hit; a whirlwind hitting three gains it three times. Points per hit (0 to 100000). Guess: about four hits pay for one cancel.
cancel_resource_per_hit = 12.0

; ---------------------------------------------------------------------------
; THE DODGE (Space): a quick dash a set distance. Its direction is fixed on its
; first frame like a move's. While it lasts you cannot walk, swing or dodge
; again. On its i-frames you cannot be hurt (your capsule turns pale blue and
; see-through); outside them an enemy hit lands as usual. Pressed inside a
; move's cancel window it ends the move at once and starts, for dodge_cost
; like a dodge from neutral; pressed at any other point of a move (or during
; hitstop) it is a PAID cancel instead, for paid_cancel_cost (see THE DODGE
; METER above). Either way it is ignored if the meter is short.

[dodge]

; How far the dodge carries you, spread evenly over its frames. m (0 to 20). Guess.
distance_m = 4.0

; How long the dodge lasts; shorter is snappier, 24 is 0.4 seconds. Frames (1 to 600). Guess.
duration_frames = 24

; First frame of the dodge in which you cannot be hurt. Frame number (1 to 600). Guess.
iframe_start_frame = 2

; Last invulnerable frame: not before the start, not after duration_frames; a wider span is more forgiving. Frame number (1 to 600). Guess.
iframe_end_frame = 14

; First frame you cannot be hurt in a PAID dodge (Space paid from the cancel meter, out of a flinch or mid-move); it lasts to iframe_end_frame. 1 = from the very first frame, so a paid escape is never punished on the spot. Frame number (1 to 600). P-O's ruling.
paid_iframe_start_frame = 1

; ---------------------------------------------------------------------------
; THE BLINK: the leap that light, light, light flows into on its own when the
; ender (light_3) ends. It goes the way the ender went: the WASD direction
; held when light_3 started, or where the camera looked if none was held. You
; cannot be hurt for the whole blink, and nothing steers or cancels it.
;
; Q brakes it: from the moment light_3 is queued (pressed early) or starts,
; until the tick the blink would start, Q kills the blink for free. The ender
; still plays out, then you stand where you are, free; your next press starts
; a fresh combo. Q at any other time does nothing.

[blink]

; How far the blink carries you, spread evenly over its frames. m (0 to 20). Guess: about 5 m.
distance_m = 7.0

; How long the blink lasts; shorter is snappier, 12 is 0.2 seconds. You are invulnerable for all of it. Frames (1 to 600). Guess.
duration_frames = 8

; ---------------------------------------------------------------------------
; POTIONS. A killed enemy may drop one (its chance is on enemies.cfg,
; potion_drop_percent): a small glowing flask on the floor. Walk over it to
; pick it up; the nearest player in reach gets it, and a player already
; carrying the most it can hold leaves it lying for the others. Your count
; is on the HUD under your HP. R drinks one (THE DRINK, below).

[potion]

; The most potions one player can carry. Whole number (0 to 100). Design rule (spec).
stack_max = 5

; How close you must walk to a potion on the floor to pick it up. m (0.1 to 20). Guess.
pickup_radius_m = 0.9

; The most potions lying on the floor at once; a new drop past this makes the oldest one lying vanish. Whole number (1 to 50). Our call (ticket 09): keeps the synced state small.
floor_max = 8

; How much less likely a kill is to drop a potion for each minute of the run, compounding, on every enemy's potion_drop_percent: 10 takes a 20% chance to 18% after a minute and 16.2% after two; it can never reach below 0. For more monsters late in a run not to mean more potions. 0 is off. % a minute (0 to 100). Measured on P-O's run of 2026-11-03 so late drops match the first minutes (docs/dev-notes/drop-scaling.md).
drop_reduction_percent_per_min = 3.5

; ---------------------------------------------------------------------------
; THE DRINK (R): with a potion carried and nothing else going on (no move, no
; hit holding you), R starts the drink. You stand still, cannot swing, dodge
; (not even a paid cancel) or walk until it ends; on its last frame the
; potion is spent and you heal. A chip does not break the drink; a flinch or
; stagger does: no heal, and you keep the potion. Healing costs a beat under
; pressure.

[drink]

; How long the drink lasts; 30 is half a second. Frames (1 to 600). Design rule (spec).
duration_frames = 30

; How much the drink heals, as a share of max HP (max_hp above); never past max HP. Percent (0 to 100). Design rule (spec).
heal_percent_of_max_hp = 35.0

; ---------------------------------------------------------------------------
; DOWNED, LIVES AND REVIVE. A player at 0 HP is down: they cannot act and
; the enemies leave them alone.
;
; Alone (solo), you have solo_lives lives: going down with a life to spare,
; you lie get_up_s, then get up where you fell with get_up_hp_percent of your
; max HP and get_up_invulnerable_s during which no hit lands. Going down on
; your last life ends the run.
;
; With friends (co-op), there are no lives: a downed player stays down until
; a teammate stands within revive_range_m of them for revive_s in a row; they
; then get up with revive_hp_percent of max HP. Stepping away, or the reviver
; being flinched or staggered, starts the count again. Everyone down at once
; ends the run.

[downed]

; Lives when playing alone; the last one lost ends the run. Whole number (1 to 99). P-O's 2.
solo_lives = 2

; Alone: how long you lie down before getting up. Seconds (0 to 60). P-O's 2 s.
get_up_s = 2.0

; Alone: the HP you get up with, in percent of max HP. Whole number (1 to 100). P-O's 50%.
get_up_hp_percent = 50

; Alone: how long after getting up no enemy hit lands on you. Seconds (0 to 60). P-O's 2 s.
get_up_invulnerable_s = 2.0

; Co-op: how close a teammate must stand to a downed player to revive them. m (0 to 50). P-O's 2 m.
revive_range_m = 2.0

; Co-op: how long the teammate must stay that close, in a row. Seconds (0 to 60). P-O's 3 s.
revive_s = 3.0

; Co-op: the HP a revived player gets up with, in percent of max HP. Whole number (1 to 100). P-O's 30%.
revive_hp_percent = 30
